[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "Document",
    "DomRect",
    "Element",
    "HtmlCanvasElement",
    "HtmlTextAreaElement",
    "MouseEvent",
    "WheelEvent",
    "Window",
] }
js-sys = "0.3"
gloo-timers = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ws-bridge = { version = "0.1", features = ["yew-client"] }
futures = "0.3"
log = "0.4"
wasm-logger = "0.2"

shared = { path = "../shared" }
